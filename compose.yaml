name: extrio

x-backend: &backend
  image: ${EXTRIO_BACKEND_IMAGE:-extrio/backend:local}
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  environment:
    EXTRIO_HOST: 0.0.0.0
    EXTRIO_DATABASE_PATH: /var/lib/extrio/extrio.db
    EXTRIO_ARTIFACT_PATH: /var/lib/extrio/artifacts
    EXTRIO_SIGNING_PRIVATE_KEY_PATH: /var/lib/extrio/keys/dev-rule-signing-key.pem
    EXTRIO_CREDENTIAL_ENCRYPTION_KEY_PATH: /var/lib/extrio/keys/dev-credential-encryption.key
    EXTRIO_CORS_ORIGINS: ${EXTRIO_CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
    EXTRIO_ALLOW_HTTP_PUBLIC: ${EXTRIO_ALLOW_HTTP_PUBLIC:-false}
    EXTRIO_SEED_DEMO: "true"
    EXTRIO_AUTH_ENABLED: ${EXTRIO_AUTH_ENABLED:-true}
    EXTRIO_AUTH_COOKIE_SECURE: ${EXTRIO_AUTH_COOKIE_SECURE:-false}
  volumes:
    - extrio-data:/var/lib/extrio
  restart: unless-stopped

services:
  api:
    <<: *backend
    command: extrio-api
    ports:
      - "${EXTRIO_API_BIND:-127.0.0.1}:${EXTRIO_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    <<: *backend
    command: extrio-worker
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ${EXTRIO_WEB_IMAGE:-extrio/web:local}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${EXTRIO_WEB_BIND:-127.0.0.1}:${EXTRIO_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  extrio-data:
