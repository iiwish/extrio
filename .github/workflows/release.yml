name: Release containers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.0-rc.1
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/extrio-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/extrio-web

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,mode=max,scope=backend-release
      - name: Build and publish web
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=web-release
          cache-to: type=gha,mode=max,scope=web-release

      - name: Scan backend amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}@${{ steps.backend.outputs.digest }}
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan backend arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}@${{ steps.backend.outputs.digest }}
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan web amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.WEB_IMAGE }}@${{ steps.web.outputs.digest }}
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan web arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.WEB_IMAGE }}@${{ steps.web.outputs.digest }}
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Sign image manifests
        env:
          COSIGN_YES: 'true'
        run: |
          cosign sign "${BACKEND_IMAGE}@${{ steps.backend.outputs.digest }}"
          cosign sign "${WEB_IMAGE}@${{ steps.web.outputs.digest }}"
      - name: Attest backend provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
      - name: Attest web provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Create GitHub release
        if: startsWith(env.RELEASE_TAG, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes
