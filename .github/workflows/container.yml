name: Container verification

on:
  pull_request:
    paths:
      - backend/**
      - web/**
      - docker/**
      - scripts/verify-compose.sh
      - compose.yaml
      - .dockerignore
      - .github/workflows/container.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - web/**
      - docker/**
      - scripts/verify-compose.sh
      - compose.yaml
      - .dockerignore
      - .github/workflows/container.yml

permissions:
  contents: read

jobs:
  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify authenticated stack
        run: ./scripts/verify-compose.sh
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: extrio/backend:e2e
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: extrio/web:e2e
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
