name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --project backend --locked --python 3.12
      - run: uv run --project backend ruff check backend/src backend/tests
      - run: uv run --project backend pytest
      - run: uv run --project backend python scripts/update-docset-manifest.py --check
      - run: uv build --project backend --wheel
      - name: Verify packaged contracts
        run: unzip -l backend/dist/*.whl | grep 'extrio/contracts_data/openapi.yaml'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web lint
      - run: pnpm --dir web build
