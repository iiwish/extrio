[project]
name = "extrio-backend"
version = "0.4.0"
description = "Extrio FastAPI control plane and collection workers"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Extrio contributors" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "crawl4ai>=0.9,<0.10",
  "crawlee[parsel]>=1.9,<2",
  "cryptography>=45,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.25,<5",
  "jsonpath-ng>=1.7,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
  "pyyaml>=6.0,<7",
  "rfc8785>=0.1,<1",
  "uvicorn[standard]>=0.35,<1",
  "croniter>=6,<7",
  "limits>=5.8,<6",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
extrio-api = "extrio.app:run"
extrio-worker = "extrio.worker:run"
extrio-backup = "extrio.cli:run_backup"
extrio-restore = "extrio.cli:run_restore"

[project.urls]
Homepage = "https://github.com/iiwish/extrio"
Repository = "https://github.com/iiwish/extrio"
Issues = "https://github.com/iiwish/extrio/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extrio"]

[tool.hatch.build.targets.wheel.force-include]
"../docs/contracts" = "extrio/contracts_data"
"migrations" = "extrio/migrations"
"../LICENSE" = "extrio/LICENSE"
"../NOTICE" = "extrio/NOTICE"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
