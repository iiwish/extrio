server {
    listen 80;
    server_name extrio-app.ouvo.ai;

    # Only the local Cloudflare Tunnel connector may reach this origin.
    allow 127.0.0.1;
    allow ::1;
    deny all;
    client_max_body_size 10m;
    access_log off;
    error_log /var/log/nginx/extrio-test-error.log warn;

    if ($http_x_forwarded_proto != "https") {
        return 308 https://extrio-app.ouvo.ai$request_uri;
    }

    # The deployment operator removes this gate after private admin setup.
    if (-f /www/extrio-demo.pending) {
        return 503;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /api/v1/auth/setup {
        return 403;
    }

    location = /metrics { return 404; }
    location = /readyz { return 404; }

    location / {
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
