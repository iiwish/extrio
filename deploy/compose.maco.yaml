name: extrio-test

x-backend: &backend
  image: ${EXTRIO_BACKEND_IMAGE:?Set the verified backend image digest}
  env_file:
    - /opt/maco-ops/secrets/extrio/test/postgres.env
  environment: &environment
    EXTRIO_HOST: 0.0.0.0
    EXTRIO_DATABASE_FROM_PG_ENV: "true"
    EXTRIO_DATABASE_AUTO_MIGRATE: "false"
    EXTRIO_DATABASE_PATH: /var/lib/extrio/unused.db
    EXTRIO_ARTIFACT_PATH: /var/lib/extrio/artifacts
    EXTRIO_SIGNING_PRIVATE_KEY_PATH: /var/lib/extrio/keys/rule-signing.pem
    EXTRIO_CREDENTIAL_ENCRYPTION_KEY_PATH: /var/lib/extrio/keys/credentials.key
    EXTRIO_SIGNING_KEY_ID: signingkey_extrio_test_001
    EXTRIO_TENANT_ID: tenant_extrio_test
    EXTRIO_CORS_ORIGINS: http://127.0.0.1:18085,http://localhost:18085
    EXTRIO_SEED_DEMO: "false"
    EXTRIO_AUTH_ENABLED: "true"
    EXTRIO_AUTH_COOKIE_SECURE: "false"
  volumes:
    - type: bind
      source: /opt/maco-apps/extrio/test/data
      target: /var/lib/extrio
      bind:
        create_host_path: false
  networks: [default, 1panel-network]
  restart: unless-stopped
  cpus: 2
  mem_limit: 2g
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  migrate:
    <<: *backend
    env_file:
      - /opt/maco-ops/secrets/extrio/test/postgres-migration.env
    command: [python, -c, "from extrio.config import get_settings; from extrio.store import Store; s=get_settings(); Store(s.database_path).initialize(migrate=True)"]
    restart: "no"

  api:
    <<: *backend
    command: [extrio-api]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *backend
    command: [extrio-worker]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, extrio-doctor]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  web:
    image: ${EXTRIO_WEB_IMAGE:?Set the verified web image digest}
    cpus: 0.5
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped
    networks: [default]
    ports: ["127.0.0.1:18085:8080"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  default: {}
  1panel-network:
    external: true
    name: 1panel-network
