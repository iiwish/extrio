      type: object
      additionalProperties: false
      required: [id, collectorId, revision, enabled, cronExpression, timezone, overlapPolicy, lastTriggeredAt, nextRunAt, updatedAt]
      properties:
        id:
          type: string
        collectorId:
          type: string
        revision:
          type: integer
          minimum: 1
        enabled:
          type: boolean
        cronExpression:
          type: string
        timezone:
          type: string
          const: Asia/Shanghai
        overlapPolicy:
          type: string
          const: forbid
        lastTriggeredAt:
          type: [string, 'null']
          format: date-time
        nextRunAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CollectionPolicyInput:
      type: object
      additionalProperties: false
      required: [mode, initialWindowDays, lookbackDays, consecutiveOlderPages, maxPages, maxItems, timezone]
      properties:
        mode:
          type: string
          const: rolling_incremental
        initialWindowDays:
          type: integer
          minimum: 1
          maximum: 3650
        lookbackDays:
          type: integer
          minimum: 0
          maximum: 90
        consecutiveOlderPages:
          type: integer
          minimum: 1
          maximum: 10
        maxPages:
          type: integer
          minimum: 1
          maximum: 1000
        maxItems:
          type: integer
          minimum: 1
          maximum: 100000
        timezone:
          type: string
          const: Asia/Shanghai
    CollectionPolicy:
      type: object
      additionalProperties: false
      required: [id, collectorId, version, mode, initialWindowDays, lookbackDays, consecutiveOlderPages, maxPages, maxItems, timezone, createdAt, digest]
      properties:
        id:
          type: string
        collectorId:
          type: string
        version:
          type: integer
          minimum: 1
        mode:
          type: string
          const: rolling_incremental
        initialWindowDays:
          type: integer
          minimum: 1
          maximum: 3650
        lookbackDays:
          type: integer
          minimum: 0
          maximum: 90
        consecutiveOlderPages:
          type: integer
          minimum: 1
          maximum: 10
        maxPages:
          type: integer
          minimum: 1
          maximum: 1000
        maxItems:
          type: integer
          minimum: 1
          maximum: 100000
        timezone:
          type: string
          const: Asia/Shanghai
        createdAt:
          type: string
          format: date-time
        digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
    CollectorCheckpoint:
      type: object
      additionalProperties: false
      required: [collectorId, policyVersionId, lastSuccessfulRunId, watermark, advancedAt]
      properties:
        collectorId:
          type: string
        policyVersionId:
          type: string
        lastSuccessfulRunId:
          type: string
        watermark:
          type: string
          format: date
        advancedAt:
          type: string
          format: date-time
    ItemLineage:
      type: object
      additionalProperties: false
      required: [sourceRevision, collectionVersion, ruleVersion, runId, observationId, artifactId]
      properties:
        sourceRevision:
          type: string
        collectionVersion:
          type: string
        ruleVersion:
          type: string
        runId:
          type: string
        observationId:
          type: [string, 'null']
        artifactId:
          type: string
    HarvestResult:
      type: object
      additionalProperties: false
      required: [id, collectorId, collectorName, sourceHost, listTitle, title, buyer, region, publishedAt, budget, content, sourceUrl, decision, changeType, rejectionReason, entityKey, revision, observedAt, changeSummary, observationHistory, lineage]
      properties:
        id:
          type: string
        collectorId:
          type: string
        collectorName:
          type: string
        sourceHost:
          type: string
        listTitle:
          type: string
          description: Title extracted from the list-stage record that produced the detail URL.
        title:
          type: string
          description: Canonical title extracted from the detail document.
        buyer:
          type: string
        region:
          type: string
        publishedAt:
          type: string
        budget:
          type: string
        content:
          type: string
          description: Normalized main content extracted from the detail document.
        extractedData:
          type: object
          description: Complete normalized field map produced by the published GatherSpec. Compatibility display fields remain projections of this map.
          additionalProperties: true
        sourceUrl:
          type: string
          format: uri
        decision:
          $ref: '#/components/schemas/ItemDecision'
        changeType:
          type: [string, 'null']
          enum: [new, updated, unchanged, null]
        rejectionReason:
          type: [string, 'null']
        entityKey:
          type: string
        revision:
          type: [integer, 'null']
          minimum: 1
        observedAt:
          type: string
          description: Collection time recorded by the Run for this observation.
        changeSummary:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, before, after]
            properties:
              field:
                type: string
              before:
                type: string
              after:
                type: string
        observationHistory:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, runId, observedAt, outcome]
            properties:
              id:
                type: string
              runId:
                type: string
              observedAt:
                type: string
              outcome:
                $ref: '#/components/schemas/ItemDecision'
        lineage:
          $ref: '#/components/schemas/ItemLineage'
      allOf:
        - if:
            properties:
              decision:
                const: accepted
          then:
            properties:
              revision:
                type: integer
                minimum: 1
              rejectionReason:
                type: 'null'
              observationHistory:
                minItems: 1
              lineage:
                properties:
                  observationId:
                    type: string
                    minLength: 1
        - if:
            properties:
              decision:
                const: rejected
          then:
            properties:
              revision:
                type: 'null'
              rejectionReason:
                type: string
                minLength: 1
              observationHistory:
                maxItems: 0
              lineage:
                properties:
                  observationId:
                    type: 'null'
    Run:
      type: object
      additionalProperties: false
      required: [id, operationId, collectorId, collectorName, collectionMode, status, startedAt, startedAtIso, duration, acceptedCount, rejectedCount, pagesFetched, listPagesFetched, detailUrlsDiscovered, detailPagesFetched, recordsOutsideWindow, duplicateDetailUrls, newItems, updatedItems, unchangedItems, paginationStopReason, ruleVersion, ruleDigest, ruleAttestationId, signingKeyId, trustRevision, integrityStatus, policyContextStatus, policyVersion, policyDigest, executionMode, windowStart, checkpointBefore, checkpointAfter, artifactMode, summary, recoveryAction, items]
      properties:
        id:
          type: string
        operationId:
          type: [string, 'null']
        collectorId:
          type: string
        collectorName:
          type: string
        collectionMode:
          $ref: '#/components/schemas/CollectionMode'
        status:
          $ref: '#/components/schemas/RunStatus'
        startedAt:
          type: string
        startedAtIso:
          type: string
          format: date-time
        duration:
          type: string
        acceptedCount:
          type: integer
        rejectedCount:
          type: integer
        pagesFetched:
          type: integer
        listPagesFetched:
          type: integer
        detailUrlsDiscovered:
          type: integer
        detailPagesFetched:
          type: integer
        recordsOutsideWindow:
          type: integer
          minimum: 0
        duplicateDetailUrls:
          type: integer
          minimum: 0
        newItems:
          type: integer
          minimum: 0
        updatedItems:
          type: integer
          minimum: 0
        unchangedItems:
          type: integer
          minimum: 0
        paginationStopReason:
          type: string
          enum: [not_applicable, empty_page, next_link_exhausted, max_pages, max_items, budget_exhausted, cross_host_blocked, time_window_reached, checkpoint_reached, detail_fetch_incomplete]
        ruleVersion:
          type: string
        ruleDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        ruleAttestationId:
          type: string
        signingKeyId:
          type: string
        trustRevision:
          type: integer
          minimum: 1
        integrityStatus:
          type: string
          enum: [verified, invalid, unavailable]
        policyContextStatus:
          type: string
          enum: [fixed, legacy_unavailable]
        policyVersion:
          type: [string, 'null']
        policyDigest:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
        executionMode:
          type: [string, 'null']
          enum: [initial, incremental, null]
        windowStart:
          type: [string, 'null']
          format: date
        checkpointBefore:
          anyOf:
            - $ref: '#/components/schemas/CollectorCheckpoint'
            - type: 'null'
        checkpointAfter:
          anyOf:
            - $ref: '#/components/schemas/CollectorCheckpoint'
            - type: 'null'
        artifactMode:
          $ref: '#/components/schemas/ArtifactMode'
        summary:
          type: string
        recoveryAction:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/HarvestResult'
      allOf:
        - if:
            properties:
              status:
                enum: [queued, running, finalizing]
          then:
            properties:
              operationId:
                type: string
                minLength: 1
    RunPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        page:
          $ref: '#/components/schemas/PageMeta'
    AiRunPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiRun'
        page:
          $ref: '#/components/schemas/PageMeta'
    ItemPage:
      type: object
      additionalProperties: false
      required: [items, page, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HarvestResult'
        page:
          $ref: '#/components/schemas/PageMeta'
        nextCursor:
          type: [string, 'null']
          description: Opaque continuation token for the next page in deterministic output-loop order; null on the last page.
    Sink:
      type: object
      additionalProperties: false
      required: [id, collectorId, type, url, enabled, version, credentialConfigured, createdAt, updatedAt]
      properties:
        id:
          type: string
        collectorId:
          type: string
        type:
          type: string
          enum: [webhook]
        url:
          type: string
          format: uri
          description: HTTP or HTTPS webhook endpoint without embedded credentials.
        enabled:
          type: boolean
        version:
          type: integer
          minimum: 1
          description: Bumped on every successful update.
        credentialConfigured:
          type: boolean
          description: True when the server holds a signing secret for this sink; the secret itself never leaves the API.
        createdAt:
          type: string
        updatedAt:
          type: string
    SinkPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sink'
        page:
          $ref: '#/components/schemas/PageMeta'
    SinkInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        type:
          type: string
          enum: [webhook]
          default: webhook
        url:
          type: string
          format: uri
          description: HTTP or HTTPS endpoint; embedded user/password credentials are rejected with INVALID_URL.
        secret:
          type: string
          description: Write-only signing secret; encrypted at rest and never returned by any response.
        enabled:
          type: boolean
          default: true
    SinkUpdateInput:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        secret:
          type: string
          description: Non-empty value replaces the stored credential; omitting the field keeps it.
        enabled:
          type: boolean
    DeliveryStatus:
      type: string
      enum: [pending, delivering, delivered, failed, dead_lettered]
    Delivery:
      type: object
      additionalProperties: false
      required: [id, collectorId, sinkId, sinkVersionId, itemEventId, status, attemptCount, nextAttemptAt, leaseUntil, lastStatusCode, lastError, redeliveryCount, createdAt, updatedAt]
      properties:
        id:
          type: string
        collectorId:
          type: string
        sinkId:
          type: string
        sinkVersionId:
          type: string
          description: Sink version captured when the delivery was enqueued.
        itemEventId:
          type: string
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        attemptCount:
          type: integer
          minimum: 0
        nextAttemptAt:
          type: [string, 'null']
        leaseUntil:
          type: [string, 'null']
        lastStatusCode:
          type: [integer, 'null']
        lastError:
          type: [string, 'null']
        redeliveryCount:
          type: integer
          minimum: 0
        kind:
          type: string
          enum: [test]
          description: Present only for synthetic sink-test deliveries (item event ids prefixed with test_).
        createdAt:
          type: string
        updatedAt:
          type: string
    DeliveryAttempt:
      type: object
      additionalProperties: false
      required: [id, deliveryId, attemptNo, startedAt, finishedAt, statusCode, error]
      properties:
        id:
          type: string
        deliveryId:
          type: string
        attemptNo:
          type: integer
          minimum: 1
        startedAt:
          type: string
        finishedAt:
          type: string
        statusCode:
          type: [integer, 'null']
        error:
          type: [string, 'null']
    DeliverySummary:
      allOf:
        - $ref: '#/components/schemas/Delivery'
        - type: object
          additionalProperties: false
          required: [latestAttempt]
          properties:
            latestAttempt:
              anyOf:
                - $ref: '#/components/schemas/DeliveryAttempt'
                - type: 'null'
    DeliveryDetail:
      allOf:
        - $ref: '#/components/schemas/Delivery'
        - type: object
          additionalProperties: false
          required: [attempts]
          properties:
            attempts:
              type: array
              items:
                $ref: '#/components/schemas/DeliveryAttempt'
    DeliveryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeliverySummary'
        page:
          $ref: '#/components/schemas/PageMeta'
