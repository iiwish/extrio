        - ITEM_NOT_FOUND
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - OPERATION_ALREADY_ACTIVE
        - REPAIR_NOT_APPLICABLE
        - RUN_ALREADY_ACTIVE
        - RULE_NOT_PUBLISHED
        - CANDIDATE_RULE_NOT_FOUND
        - CANDIDATE_VALIDATION_FAILED
