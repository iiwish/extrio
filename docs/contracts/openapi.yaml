      properties:
        id:
          type: string
        operationId:
          type: string
        collectorId:
          type: string
        collectorName:
          type: string
        sourceUrl:
          type: string
          format: uri
        kind:
          $ref: '#/components/schemas/AiRunKind'
        trigger:
          $ref: '#/components/schemas/AiRunTrigger'
        initiatedBy:
          type: string
        status:
          $ref: '#/components/schemas/OperationStatus'
        phase:
          $ref: '#/components/schemas/OperationPhase'
        progress:
