        discovery:
          type: object
          additionalProperties: false
          required: [listPagesSampled, detailUrlsDiscovered, detailPagesValidated, detailUrlSamples]
          properties:
            listPagesSampled:
              type: integer
              minimum: 0
            detailUrlsDiscovered:
              type: integer
              minimum: 0
            detailPagesValidated:
              type: integer
              minimum: 0
            detailUrlSamples:
              type: array
              items:
                type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CandidateField'
        passedChecks:
          type: integer
        warningChecks:
          type: integer
        gatherSpec:
          $ref: './gather-spec.schema.json'
      allOf:
        - if:
            properties:
              mode:
                const: single
          then:
            properties:
              detailLinkSelector:
                type: 'null'
              pagination:
                $ref: '#/components/schemas/PaginationNone'
              discovery:
                properties:
