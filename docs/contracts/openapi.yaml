          const: next_link
        selector:
          type: string
        maxPages:
          type: integer
        allowCrossHost:
          type: boolean
          const: false
    CandidateRule:
      type: object
      additionalProperties: false
      required: [id, digest, mode, listSelector, detailLinkSelector, pagination, discovery, fields, passedChecks, warningChecks, gatherSpec]
      properties:
        id:
          type: string
        digest:
          type: string
        mode:
          $ref: '#/components/schemas/CollectionMode'
        listSelector:
          type: string
        detailLinkSelector:
          type: [string, 'null']
        pagination:
          oneOf:
            - $ref: '#/components/schemas/PaginationNone'
            - $ref: '#/components/schemas/PaginationPage'
            - $ref: '#/components/schemas/PaginationNextLink'
        discovery:
          type: object
          additionalProperties: false
          required: [listPagesSampled, detailUrlsDiscovered, detailPagesValidated, detailUrlSamples]
          properties:
            listPagesSampled:
              type: integer
              minimum: 0
            detailUrlsDiscovered:
              type: integer
              minimum: 0
            detailPagesValidated:
              type: integer
              minimum: 0
            detailUrlSamples:
              type: array
              items:
                type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CandidateField'
        passedChecks:
          type: integer
        warningChecks:
          type: integer
        gatherSpec:
          $ref: './gather-spec.schema.json'
      allOf:
        - if:
            properties:
              mode:
                const: single
          then:
            properties:
              detailLinkSelector:
                type: 'null'
              pagination:
                $ref: '#/components/schemas/PaginationNone'
              discovery:
                properties:
                  detailUrlsDiscovered:
                    const: 0
                  detailPagesValidated:
                    const: 0
                  detailUrlSamples:
                    maxItems: 0
        - if:
            properties:
              mode:
                const: list_detail
          then:
            properties:
              detailLinkSelector:
                type: string
                minLength: 1
