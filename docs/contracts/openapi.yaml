openapi: 3.1.0
info:
  title: Extrio Control Plane API
  version: 1.15.0
  description: Versioned browser-facing control-plane contract for Extrio, including the v0.3 output loop (item export, sinks, deliveries).
x-contract-id: extrio.control-plane.v1
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /runtime:
    get:
      operationId: getRuntimeDiagnostics
      responses:
        '200':
          description: Authenticated deployment readiness without paths or secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeDiagnostics'
        default:
          $ref: '#/components/responses/PlatformError'
  /collections:
    get:
      operationId: listCollections
      responses:
        '200':
          description: All requirement summaries, including archived and empty requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPage'
        default:
          $ref: '#/components/responses/PlatformError'
    post:
      operationId: createCollection
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionInput'
      responses:
        '201':
          description: Independent requirement created. Engineer or administrator required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        default:
          $ref: '#/components/responses/PlatformError'
  /collections/{collectionId}:
    parameters:
      - name: collectionId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCollection
      responses:
        '200':
          description: Requirement and all linked sources, without the collectors list limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
        default:
          $ref: '#/components/responses/PlatformError'
    patch:
      operationId: updateCollection
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionUpdateInput'
      responses:
        '200':
          description: Metadata updated or archived/restored. Does not change existing extraction rules or stop runs. Engineer or administrator required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        default:
          $ref: '#/components/responses/PlatformError'
    delete:
      operationId: deleteCollection
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Empty requirement deleted. Associated sources block deletion with 409. Engineer or administrator required.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: string
                  deleted:
                    const: true
        default:
          $ref: '#/components/responses/PlatformError'
  /collections/{collectionId}/publish-version:
    parameters:
      - name: collectionId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: publishCollectionVersion
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionVersionPublishInput'
      responses:
        '201':
          description: Collection version published immutably. Reviewer or administrator required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionVersion'
        default:
          $ref: '#/components/responses/PlatformError'
  /collections/{collectionId}/versions:
    parameters:
      - name: collectionId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listCollectionVersions
      responses:
        '200':
          description: All published versions for a collection, ordered by versionNumber descending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionVersionList'
        default:
          $ref: '#/components/responses/PlatformError'
  /collections/{collectionId}/versions/{versionId}:
    parameters:
      - name: collectionId
        in: path
        required: true
        schema:
          type: string
      - name: versionId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCollectionVersion
      responses:
        '200':
          description: Specified collection version details and frozen contract schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionVersion'
        default:
          $ref: '#/components/responses/PlatformError'
  /collection-templates:
    get:
      operationId: "collectionTemplates"
      responses:
        200:
          description: "Collection field workflow result. Mutations require the documented engineer/reviewer role."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionTemplateList"
        default:
          $ref: "#/components/responses/PlatformError"
  /collections/{collectionId}/apply-template:
    parameters:
      -
        name: "collectionId"
        in: "path"
        required: true
        schema:
          type: "string"
    post:
      operationId: "applyCollectionTemplate"
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
      responses:
        200:
          description: "Collection field workflow result. Mutations require the documented engineer/reviewer role."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        default:
          $ref: "#/components/responses/PlatformError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyTemplateInput"
  /collections/{collectionId}/field-suggestions:
    parameters:
      -
        name: "collectionId"
        in: "path"
        required: true
        schema:
          type: "string"
    get:
      operationId: "listFieldSuggestions"
      responses:
        200:
          description: "Collection field workflow result. Mutations require the documented engineer/reviewer role."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldSuggestionList"
        default:
          $ref: "#/components/responses/PlatformError"
    post:
      operationId: "startFieldSuggestion"
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
      responses:
        202:
          description: "Collection field workflow result. Mutations require the documented engineer/reviewer role."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldSuggestion"
        default:
          $ref: "#/components/responses/PlatformError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldSuggestionInput"
  /collections/{collectionId}/field-suggestions/{suggestionId}/apply:
    parameters:
      -
        name: "collectionId"
        in: "path"
        required: true
        schema:
          type: "string"
      -
        name: "suggestionId"
        in: "path"
        required: true
        schema:
          type: "string"
    post:
      operationId: "applyFieldSuggestion"
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
      responses:
        200:
          description: "Collection field workflow result. Mutations require the documented engineer/reviewer role."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        default:
          $ref: "#/components/responses/PlatformError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplySuggestionInput"
  /collectors/{collectorId}/collection-migration:
    parameters:
      -
        name: "collectorId"
        in: "path"
        required: true
        schema:
          type: "string"
    get:
      operationId: "getCollectionMigration"
      responses:
        200:
          description: "Collection field workflow result. Mutations require the documented engineer/reviewer role."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionMigrationPlan"
        default:
          $ref: "#/components/responses/PlatformError"
      parameters:
        -
          name: "targetVersionId"
          in: "query"
          required: true
          schema:
            type: "string"
    post:
      operationId: "migrateCollectionVersion"
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
      responses:
        200:
          description: "Collection field workflow result. Mutations require the documented engineer/reviewer role."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorDetail"
        default:
          $ref: "#/components/responses/PlatformError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionMigrationInput"
  /collectors/{collectorId}/collection-migration/cancel:
    parameters:
      -
        name: "collectorId"
        in: "path"
        required: true
        schema:
          type: "string"
    post:
      operationId: "cancelCollectionMigration"
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
      responses:
        200:
          description: "Collection field workflow result. Mutations require the documented engineer/reviewer role."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorDetail"
        default:
          $ref: "#/components/responses/PlatformError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelCollectionMigrationInput"
  /auth/state:
    get:
      operationId: getAuthState
      security: []
      responses:
        '200':
          description: Authentication, first-run setup, and current-session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        default:
          $ref: '#/components/responses/PlatformError'
  /auth/setup:
    post:
      operationId: setupAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSetupInput'
      responses:
        '200':
          description: First administrator created and authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        default:
          $ref: '#/components/responses/PlatformError'
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginInput'
      responses:
        '200':
          description: Authenticated browser session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        default:
          $ref: '#/components/responses/PlatformError'
  /auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          description: Browser session revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authenticated]
                properties:
                  authenticated:
                    const: false
        default:
          $ref: '#/components/responses/PlatformError'
  /users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: Team accounts ordered by creation, without credential material.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        default:
          $ref: '#/components/responses/PlatformError'
    post:
      operationId: createUser
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
      responses:
        '201':
          description: Team account created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/PlatformError'
  /users/{userId}:
    patch:
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          description: Identifier of the team account to update.
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: Team account updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/PlatformError'
  /settings/models:
    get:
      operationId: getModelConfiguration
      responses:
        '200':
          description: Provider and model configurations without secret material.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConfiguration'
        default:
          $ref: '#/components/responses/PlatformError'
    put:
      operationId: updateModelConfiguration
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelConfigurationInput'
      responses:
        '200':
          description: Provider and model configurations saved.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConfiguration'
        default:
          $ref: '#/components/responses/PlatformError'
  /settings/model:
    get:
      operationId: getModelSetting
      responses:
        '200':
          description: Model provider configuration without secret material.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSetting'
        default:
          $ref: '#/components/responses/PlatformError'
    put:
      operationId: updateModelSetting
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelSettingInput'
      responses:
        '200':
          description: Model provider configuration saved.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSetting'
        default:
          $ref: '#/components/responses/PlatformError'
  /settings/platform:
    get:
      operationId: getPlatformSettings
      description: Returns platform collection policy settings. Available to any authenticated role.
      responses:
        '200':
          description: Platform settings without secret material.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        default:
          $ref: '#/components/responses/PlatformError'
    put:
      operationId: updatePlatformSettings
      description: >-
        Updates platform collection policy settings. Administrators only; other roles receive FORBIDDEN.
        When allowAnonymousHttp is true (default), collector creation accepts anonymous http:// entry URLs;
        when false, http:// sources are rejected with HTTPS_REQUIRED unless localhost. Credential-bearing
        sources always require HTTPS regardless of this setting. Existing collectors are unaffected.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettingsInput'
      responses:
        '200':
          description: Platform settings saved.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors:
    get:
      operationId: listCollectors
      parameters:
        - name: lifecycle
          in: query
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Collector page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorPage'
        default:
          $ref: '#/components/responses/PlatformError'
    post:
      operationId: createCollector
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectorInput'
      responses:
        '201':
          description: Collector created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/batch:
    post:
      operationId: batchCreateCollectors
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectorsInput'
      responses:
        '200':
          description: Per-source result. Item failures do not roll back valid sources.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCollectorImportResult'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}:
    get:
      operationId: getCollector
      parameters:
        - $ref: '#/components/parameters/CollectorId'
      responses:
        '200':
          description: Collector detail.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
    patch:
      operationId: updateCollectorDefinition
      description: Updates the editable Collector definition. Changing intent or sourceUrl invalidates the current candidate and requires exploration and publication before another Run.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectorInput'
      responses:
        '200':
          description: Collector definition updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/lifecycle:
    get:
      operationId: getCollectorLifecyclePlan
      parameters:
        - $ref: '#/components/parameters/CollectorId'
      responses:
        '200':
          description: Locked source lifecycle preview and deletion blockers.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorLifecyclePlan'
        default:
          $ref: '#/components/responses/PlatformError'
    post:
      operationId: changeCollectorLifecycle
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectorLifecycleInput'
      responses:
        '200':
          description: Archived or restored source, or source deletion receipt. Deletion retains history and releases the URL. Schedule remains disabled.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorLifecycleResult'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/reassignment:
    get:
      operationId: getCollectorReassignmentPlan
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - name: targetCollectionId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Target version, field differences, frozen history and blockers.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorReassignmentPlan'
        default:
          $ref: '#/components/responses/PlatformError'
    post:
      operationId: reassignCollector
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectorReassignmentInput'
      responses:
        '200':
          description: Source bound to target; execution invalidated, immutable history retained under its original requirement.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/explorations:
    post:
      operationId: startCollectorExploration
      description: >-
        Starts a governed AI rule-generation task. Optional operator guidance is treated as untrusted intent,
        is recorded on the AiRun, and may influence rule discovery and compilation without relaxing the
        selector dialect, source boundary, output contract, deterministic validation, or human-review gate.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplorationInput'
      responses:
        '202':
          description: Exploration accepted for asynchronous execution.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/repairs:
    post:
      operationId: startCollectorRepair
      description: >-
        Starts an AI rule repair for a Collector whose published or candidate rule no longer matches the source website.
        The worker re-explores the source, recompiles the rule from the old GatherSpec plus fresh page snapshots while
        preserving the frozen output contract (identityFields, fingerprintFields, normalizedItemSchema, fieldBindings,
        quality, tombstonePolicy) byte-for-byte, and the repaired candidate re-enters the standard human review and
        publication pipeline. Fails with REPAIR_NOT_APPLICABLE when the Collector has no repairable rule and with
        OPERATION_ALREADY_ACTIVE when another asynchronous task is running.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairInput'
      responses:
        '202':
          description: Repair accepted for asynchronous execution; the AI run is recorded with kind rule_repair.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/evidence-bundle:
    get:
      operationId: exportCollectorEvidenceBundle
      summary: Download the signed evidence bundle (ZIP) for one collector.
      description: >-
        Streams a deterministic, verifiable extrio.evidence.v1 ZIP archive proving what the collector
        gathered, under which attested rule, with what lineage. The optional since/until bounds are inclusive
        ISO-8601 filters on run creation time and item observedAt; ruleVersionId scopes the bundle to a single
        rule version. Available to any authenticated role (read surface, like the items export). Fails with
        EVIDENCE_BUNDLE_ERROR when the bundle cannot be built, for example an unknown rule version.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - name: since
          in: query
          required: false
          description: Inclusive ISO-8601 lower bound on run createdAt and item observedAt.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: Inclusive ISO-8601 upper bound on run createdAt and item observedAt.
          schema:
            type: string
            format: date-time
        - name: ruleVersionId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Signed evidence bundle ZIP archive (extrio.evidence.v1).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Content-Disposition:
              description: Always 'attachment; filename="extrio-evidence-{collectorId}.zip"'.
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: The bundle cannot be built (EVIDENCE_BUNDLE_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/collection-policy:
    post:
      operationId: createCollectionPolicyVersion
      description: Creates an immutable CollectionPolicy version, activates it and resets the mutable checkpoint.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionPolicyInput'
      responses:
        '200':
          description: CollectionPolicy version activated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/schedule:
    put:
      operationId: updateCollectorSchedule
      description: Creates a new schedule revision and atomically activates it for the Collector.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectorScheduleInput'
      responses:
        '200':
          description: Collector schedule updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/candidate-rule:
    patch:
      operationId: updateCollectorCandidateRule
      description: Creates a new mutable candidate from direct rule edits. Published RuleVersions remain immutable and execution is blocked until the candidate is reviewed and published.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateRuleEditInput'
      responses:
        '200':
          description: Candidate rule updated and ready for review.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/publish:
    post:
      operationId: publishCollectorRule
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRuleInput'
      responses:
        '200':
          description: RuleVersion published atomically.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/runs:
    post:
      operationId: startCollectorRun
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Run accepted for asynchronous execution.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/PlatformError'
  /operations/{operationId}:
    get:
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Durable command progress. Terminal operations never return to a non-terminal state.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/PlatformError'
  /operations/{operationId}/cancel:
    post:
      operationId: cancelOperation
      description: Engineer or administrator requests cancellation. Active work stops before terminal cancellation; completed operations are unchanged.
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Durable cancellation request or terminal operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/PlatformError'
  /ai-runs:
    get:
      operationId: listAiRuns
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: collectorId
          in: query
          required: false
          schema:
            type: string
          description: Restrict history to one collector.
      responses:
        '200':
          description: AI task history ordered by creation time.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRunPage'
        default:
          $ref: '#/components/responses/PlatformError'
  /ai-runs/{aiRunId}:
    get:
      operationId: getAiRun
      parameters:
        - $ref: '#/components/parameters/AiRunId'
      responses:
        '200':
          description: AI task result, attempts, and model-call evidence.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRunDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /overview:
    get:
      operationId: getOverview
      description: Full-database aggregates for authenticated users. Calendar windows use the requested IANA timezone, weeks start Monday. Run timestamps are persisted created_at; success rates use completed runs only. Month entities are ranked like the entity list before filtering by the latest row's UTC persistence timestamp, not the legacy observedAt display string. No 200-row list cap applies.
      parameters:
        - name: timezone
          in: query
          schema:
            type: string
            default: UTC
            maxLength: 100
          description: IANA timezone. Unknown zones return 422.
      responses:
        '200':
          description: Consistent database snapshot of overview metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        default:
          $ref: '#/components/responses/PlatformError'
  /runs:
    get:
      operationId: listRuns
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Run page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        default:
          $ref: '#/components/responses/PlatformError'
  /runs/{runId}/evidence:
    get:
      operationId: getRunEvidence
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Verified local sampled evidence availability. Does not authorize equivalent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEvidence'
        default:
          $ref: '#/components/responses/PlatformError'
  /runs/{runId}:
    get:
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run snapshot.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          $ref: '#/components/responses/PlatformError'
  /items:
    get:
      operationId: listItems
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ItemView'
        - $ref: '#/components/parameters/ItemSearch'
        - $ref: '#/components/parameters/ItemSourceHost'
        - name: collectorId
          in: query
          schema:
            type: string
        - name: runId
          in: query
          schema:
            type: string
        - name: decision
          in: query
          schema:
            $ref: '#/components/schemas/ItemDecision'
        - name: entityKey
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Observations or latest entities in deterministic order. Entity selection precedes filtering; entities include total and global filter facets.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
        '400':
          description: The cursor is not a valid continuation token (INVALID_CURSOR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
  /items/export:
    get:
      operationId: exportItems
      summary: Stream items as CSV or JSONL in the same deterministic order as listItems.
      description: >-
        The response body is streamed. The server enforces the export item cap before streaming
        starts; requests whose filter scope exceeds the cap are rejected with EXPORT_TOO_LARGE and
        no body is streamed. CSV columns are the fixed columns followed by the alphabetical union
        of extractedData keys (missing values stay empty). The CSV body starts with a UTF-8 BOM.
      parameters:
        - $ref: '#/components/parameters/ItemView'
        - $ref: '#/components/parameters/ItemSearch'
        - $ref: '#/components/parameters/ItemSourceHost'
        - name: format
          in: query
          required: true
          description: Export wire format.
          schema:
            type: string
            enum: [csv, jsonl]
        - name: collectorId
          in: query
          required: false
          schema:
            type: string
        - name: runId
          in: query
          required: false
          schema:
            type: string
        - name: decision
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ItemDecision'
        - name: entityKey
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Streamed export of at most 100000 items.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            text/csv:
              schema:
                type: string
            application/x-ndjson:
              schema:
                type: string
        '400':
          description: The export scope exceeds the item cap (EXPORT_TOO_LARGE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
  /items/{itemId}:
    get:
      operationId: getItem
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Accepted item or rejected candidate result.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestResult'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/sinks:
    get:
      operationId: listSinks
      summary: List the output sinks configured for one collector.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
      responses:
        '200':
          description: Sinks ordered by creation time; secrets never appear in responses.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinkPage'
        default:
          $ref: '#/components/responses/PlatformError'
    post:
      operationId: createSink
      summary: Register a webhook output sink for the collector.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SinkInput'
      responses:
        '201':
          description: Sink created with version 1.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sink'
        '400':
          description: The URL is not a plain HTTP/HTTPS endpoint or embeds credentials (INVALID_URL).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/sinks/{sinkId}:
    put:
      operationId: updateSink
      summary: Partially update a sink; every update bumps its version.
      description: Omitted fields keep their stored values; an omitted secret keeps the stored credential.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/SinkId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SinkUpdateInput'
      responses:
        '200':
          description: Updated sink with a bumped version.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sink'
        '400':
          description: The URL is not a plain HTTP/HTTPS endpoint or embeds credentials (INVALID_URL).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        '404':
          description: The sink does not exist for this collector (SINK_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
    delete:
      operationId: deleteSink
      summary: Remove an output sink.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/SinkId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Sink removed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '404':
          description: The sink does not exist for this collector (SINK_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/sinks/{sinkId}/test:
    post:
      operationId: testSink
      summary: Enqueue a synthetic test delivery for a sink.
      description: >-
        Enqueues a delivery with a synthetic `test_` item event id and kind=test; the delivery
        worker performs the actual HTTP call asynchronously. Returns 202 with the delivery resource.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/SinkId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Test delivery enqueued; Location points at the delivery resource.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              description: Relative URL of the enqueued delivery.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '404':
          description: The collector or sink does not exist (COLLECTOR_NOT_FOUND / SINK_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/deliveries:
    get:
      operationId: listCollectorDeliveries
      summary: List the deliveries of one collector with their latest attempt summary.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
      responses:
        '200':
          description: Deliveries ordered by creation time.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryPage'
        default:
          $ref: '#/components/responses/PlatformError'
  /deliveries/{deliveryId}:
    get:
      operationId: getDelivery
      summary: Fetch one delivery with its full attempt history.
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
      responses:
        '200':
          description: Delivery resource with all recorded attempts.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDetail'
        '404':
          description: The delivery does not exist (DELIVERY_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
  /deliveries/{deliveryId}/redeliver:
    post:
      operationId: redeliverDelivery
      summary: Reset a delivery to pending for another delivery attempt.
      description: Works from delivered, failed and dead_lettered deliveries; delivering rows must wait for their lease to expire (DELIVERY_IN_FLIGHT).
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The same delivery reset to pending with an incremented redeliveryCount.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '404':
          description: The delivery does not exist (DELIVERY_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        '409':
          description: The delivery is actively being delivered (DELIVERY_IN_FLIGHT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
components:
  headers:
    RequestId:
      description: Correlation identifier for logs, audit evidence and support.
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: extrio_session
  parameters:
    ItemView:
      name: view
      in: query
      description: Observations retain history. Entities select the latest observation per collectorId and entityKey before applying all filters.
      schema:
        type: string
        enum: [observations, entities]
        default: observations
    ItemSearch:
      name: q
      in: query
      description: Trimmed, case-insensitive literal substring search across title, content, collectorName and entityKey. Percent and underscore are literal characters.
      schema:
        type: string
        maxLength: 500
    ItemSourceHost:
      name: sourceHost
      in: query
      description: Exact site host filter, shared by list and export.
      schema:
        type: string
    CollectorId:
      name: collectorId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
    AiRunId:
      name: aiRunId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SinkId:
      name: sinkId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable UUID or equivalent token for one logical mutation. Retries reuse the same value.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    PlatformError:
      description: Stable machine-readable API error.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlatformError'
  schemas:
    RuntimeDiagnostics:
      type: object
      additionalProperties: false
      required: [ready, reason, liveWorkers, mismatchedWorkers, workers, queue, heartbeatMaxAgeSeconds, checkedAt]
      properties:
        ready:
          type: boolean
        reason:
          enum: [worker_unavailable, worker_deployment_mismatch, credential_key_unavailable, signing_key_unavailable, signing_key_mismatch, signing_key_not_trusted, null]
        liveWorkers:
          type: integer
          minimum: 0
        mismatchedWorkers:
          type: integer
          minimum: 0
        workers:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [id, lastSeen, deploymentMatches]
            properties:
              id:
                type: string
              lastSeen:
                type: string
                format: date-time
              deploymentMatches:
                type: boolean
        queue:
          type: object
          additionalProperties: false
          required: [queuedJobs, runningJobs, oldestDueSeconds]
          properties:
            queuedJobs:
              type: integer
              minimum: 0
            runningJobs:
              type: integer
              minimum: 0
            oldestDueSeconds:
              type: integer
              minimum: 0
        heartbeatMaxAgeSeconds:
          type: integer
        checkedAt:
          type: string
          format: date-time
    CollectionInput:
      type: object
      additionalProperties: false
      required: [name, intent]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        intent:
          type: string
          minLength: 1
          maxLength: 10000
    CollectionUpdateInput:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        fieldDraft:
          $ref: '#/components/schemas/CollectionFieldDraft'
        revision:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        intent:
          type: string
          minLength: 1
          maxLength: 10000
        status:
          type: string
          enum: [active, archived]
      oneOf:
        - required: [status]
          not:
            anyOf:
              - required: [name]
              - required: [intent]
              - required: [fieldDraft]
        - not:
            required: [status]
          anyOf:
            - required: [name]
            - required: [intent]
            - required: [fieldDraft]
    CollectionField:
      type: object
      additionalProperties: false
      required: [key, label, type, required, identity, fingerprint, description]
      properties:
        key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
        label:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum: [string, number, integer, boolean, date, datetime, url, html, object, array]
        required:
          type: boolean
        identity:
          type: boolean
        fingerprint:
          type: boolean
        description:
          type: string
          maxLength: 2000
    CollectionFieldDraft:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CollectionField'
    CollectionTemplate:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "name"
        - "version"
        - "fields"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        version:
          type: "integer"
          minimum: 1
        fields:
          type: "array"
          items:
            $ref: "#/components/schemas/CollectionField"
    CollectionTemplateList:
      type: "object"
      additionalProperties: false
      required:
        - "items"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/CollectionTemplate"
    FieldSuggestionInvocation:
