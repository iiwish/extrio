      additionalProperties: false
      required: [phase, status, startedAt, finishedAt, durationMs, metrics]
      properties:
        phase:
          $ref: '#/components/schemas/OperationPhase'
        status:
          $ref: '#/components/schemas/ActivityStatus'
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        durationMs:
          type: [integer, 'null']
          minimum: 0
        metrics:
          $ref: '#/components/schemas/OperationMetrics'
    Operation:
      type: object
      additionalProperties: false
      required: [id, kind, status, phase, progress, resourceType, resourceId, statusUrl, pollAfterMs, metrics, error]
      properties:
        collectionAttribution:
          $ref: '#/components/schemas/CollectionAttribution'
        collectorDeleted:
          type: boolean
          description: The source was deleted; this historical record remains available.
        cancelRequested:
          type: boolean
          description: Cancellation is persisted; running work remains active until its owning worker has stopped it or its lease expires.
        id:
          type: string
        kind:
          $ref: '#/components/schemas/OperationKind'
        status:
          $ref: '#/components/schemas/OperationStatus'
        phase:
          $ref: '#/components/schemas/OperationPhase'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        resourceType:
          type: string
          enum: [collector, run]
        resourceId:
          type: string
        statusUrl:
          type: string
        pollAfterMs:
          type: integer
          minimum: 100
          maximum: 10000
        queuedAt:
          type: string
          format: date-time
          description: UTC time when the operation entered the durable queue. Older migrated operations may omit it.
        aiRunId:
          type: string
          description: Stable AI task identifier for exploration operations. Run operations omit this field.
        activity:
          type: array
          description: Sanitized, append-only phase history for live progress and post-run audit. Older migrated operations may omit it.
          items:
            $ref: '#/components/schemas/OperationActivity'
        metrics:
          $ref: '#/components/schemas/OperationMetrics'
        error:
          anyOf:
            - $ref: '#/components/schemas/PlatformError'
            - type: 'null'
      allOf:
        - if:
            properties:
              status:
                enum: [queued, running]
          then:
            properties:
              error:
                type: 'null'
        - if:
            properties:
              status:
                enum: [succeeded, failed, cancelled, timed_out]
          then:
            properties:
              phase:
                const: completed
              progress:
                const: 100
        - if:
            properties:
              status:
                const: succeeded
          then:
            properties:
              error:
                type: 'null'
        - if:
            properties:
              status:
