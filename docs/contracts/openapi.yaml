      required: [key, label, selector, required, confidence, sample, evidence, warning]
      properties:
        key:
          type: string
        label:
          type: string
        selector:
          type: string
        required:
          type: boolean
        confidence:
          type: number
          minimum: 0
          maximum: 1
        sample:
          type: string
        evidence:
          type: string
        warning:
          type: [string, 'null']
    PaginationNone:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: none
    PaginationPage:
      type: object
      additionalProperties: false
      required: [type, parameter, start, step, maxPages, stopWhenNoItems]
      properties:
        type:
          type: string
          const: page
        parameter:
          type: string
        start:
          type: integer
        step:
          type: integer
        maxPages:
          type: integer
        stopWhenNoItems:
          type: boolean
    PaginationNextLink:
      type: object
      additionalProperties: false
