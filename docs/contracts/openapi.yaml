openapi: 3.1.0
info:
  title: Extrio Control Plane API
  version: 1.14.0
  description: Versioned browser-facing control-plane contract for Extrio, including the v0.3 output loop (item export, sinks, deliveries).
x-contract-id: extrio.control-plane.v1
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/state:
    get:
      operationId: getAuthState
      security: []
      responses:
        '200':
          description: Authentication, first-run setup, and current-session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        default:
          $ref: '#/components/responses/PlatformError'
  /auth/setup:
    post:
      operationId: setupAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSetupInput'
      responses:
        '200':
          description: First administrator created and authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        default:
          $ref: '#/components/responses/PlatformError'
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginInput'
      responses:
        '200':
          description: Authenticated browser session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        default:
          $ref: '#/components/responses/PlatformError'
  /auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          description: Browser session revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authenticated]
                properties:
                  authenticated:
                    const: false
        default:
          $ref: '#/components/responses/PlatformError'
  /settings/models:
    get:
      operationId: getModelConfiguration
      responses:
        '200':
          description: Provider and model configurations without secret material.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConfiguration'
        default:
          $ref: '#/components/responses/PlatformError'
    put:
      operationId: updateModelConfiguration
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelConfigurationInput'
      responses:
        '200':
          description: Provider and model configurations saved.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConfiguration'
        default:
          $ref: '#/components/responses/PlatformError'
  /settings/model:
    get:
      operationId: getModelSetting
      responses:
        '200':
          description: Model provider configuration without secret material.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSetting'
        default:
          $ref: '#/components/responses/PlatformError'
    put:
      operationId: updateModelSetting
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelSettingInput'
      responses:
        '200':
          description: Model provider configuration saved.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSetting'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors:
    get:
      operationId: listCollectors
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Collector page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorPage'
        default:
          $ref: '#/components/responses/PlatformError'
    post:
      operationId: createCollector
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectorInput'
      responses:
        '201':
          description: Collector created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/batch:
    post:
      operationId: batchCreateCollectors
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectorsInput'
      responses:
        '200':
          description: Per-source result. Item failures do not roll back valid sources.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCollectorImportResult'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}:
    get:
      operationId: getCollector
      parameters:
        - $ref: '#/components/parameters/CollectorId'
      responses:
        '200':
          description: Collector detail.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
    patch:
      operationId: updateCollectorDefinition
      description: Updates the editable Collector definition. Changing intent or sourceUrl invalidates the current candidate and requires exploration and publication before another Run.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectorInput'
      responses:
        '200':
          description: Collector definition updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/explorations:
    post:
      operationId: startCollectorExploration
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Exploration accepted for asynchronous execution.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/collection-policy:
    post:
      operationId: createCollectionPolicyVersion
      description: Creates an immutable CollectionPolicy version, activates it and resets the mutable checkpoint.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionPolicyInput'
      responses:
        '200':
          description: CollectionPolicy version activated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/schedule:
    put:
      operationId: updateCollectorSchedule
      description: Creates a new schedule revision and atomically activates it for the Collector.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectorScheduleInput'
      responses:
        '200':
          description: Collector schedule updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/candidate-rule:
    patch:
      operationId: updateCollectorCandidateRule
      description: Creates a new mutable candidate from direct rule edits. Published RuleVersions remain immutable and execution is blocked until the candidate is reviewed and published.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateRuleEditInput'
      responses:
        '200':
          description: Candidate rule updated and ready for review.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/publish:
    post:
      operationId: publishCollectorRule
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRuleInput'
      responses:
        '200':
          description: RuleVersion published atomically.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/runs:
    post:
      operationId: startCollectorRun
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Run accepted for asynchronous execution.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/PlatformError'
  /operations/{operationId}:
    get:
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Durable command progress. Terminal operations never return to a non-terminal state.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/PlatformError'
  /ai-runs:
    get:
      operationId: listAiRuns
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: collectorId
          in: query
          required: false
          schema:
            type: string
          description: Restrict history to one collector.
      responses:
        '200':
          description: AI task history ordered by creation time.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRunPage'
        default:
          $ref: '#/components/responses/PlatformError'
  /ai-runs/{aiRunId}:
    get:
      operationId: getAiRun
      parameters:
        - $ref: '#/components/parameters/AiRunId'
      responses:
        '200':
          description: AI task result, attempts, and model-call evidence.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRunDetail'
        default:
          $ref: '#/components/responses/PlatformError'
  /runs:
    get:
      operationId: listRuns
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Run page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        default:
          $ref: '#/components/responses/PlatformError'
  /runs/{runId}:
    get:
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run snapshot.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          $ref: '#/components/responses/PlatformError'
  /items:
    get:
      operationId: listItems
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Accepted items and rejected candidates in deterministic output-loop order.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
        '400':
          description: The cursor is not a valid continuation token (INVALID_CURSOR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
  /items/export:
    get:
      operationId: exportItems
      summary: Stream items as CSV or JSONL in the same deterministic order as listItems.
      description: >-
        The response body is streamed. The server enforces the export item cap before streaming
        starts; requests whose filter scope exceeds the cap are rejected with EXPORT_TOO_LARGE and
        no body is streamed. CSV columns are the fixed columns followed by the alphabetical union
        of extractedData keys (missing values stay empty). The CSV body starts with a UTF-8 BOM.
      parameters:
        - name: format
          in: query
          required: true
          description: Export wire format.
          schema:
            type: string
            enum: [csv, jsonl]
        - name: collectorId
          in: query
          required: false
          schema:
            type: string
        - name: runId
          in: query
          required: false
          schema:
            type: string
        - name: decision
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ItemDecision'
        - name: entityKey
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Streamed export of at most 100000 items.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            text/csv:
              schema:
                type: string
            application/x-ndjson:
              schema:
                type: string
        '400':
          description: The export scope exceeds the item cap (EXPORT_TOO_LARGE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
  /items/{itemId}:
    get:
      operationId: getItem
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Accepted item or rejected candidate result.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestResult'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/sinks:
    get:
      operationId: listSinks
      summary: List the output sinks configured for one collector.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
      responses:
        '200':
          description: Sinks ordered by creation time; secrets never appear in responses.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinkPage'
        default:
          $ref: '#/components/responses/PlatformError'
    post:
      operationId: createSink
      summary: Register a webhook output sink for the collector.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SinkInput'
      responses:
        '201':
          description: Sink created with version 1.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sink'
        '400':
          description: The URL is not a plain HTTP/HTTPS endpoint or embeds credentials (INVALID_URL).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/sinks/{sinkId}:
    put:
      operationId: updateSink
      summary: Partially update a sink; every update bumps its version.
      description: Omitted fields keep their stored values; an omitted secret keeps the stored credential.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/SinkId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SinkUpdateInput'
      responses:
        '200':
          description: Updated sink with a bumped version.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sink'
        '400':
          description: The URL is not a plain HTTP/HTTPS endpoint or embeds credentials (INVALID_URL).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        '404':
          description: The sink does not exist for this collector (SINK_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
    delete:
      operationId: deleteSink
      summary: Remove an output sink.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/SinkId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Sink removed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '404':
          description: The sink does not exist for this collector (SINK_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/sinks/{sinkId}/test:
    post:
      operationId: testSink
      summary: Enqueue a synthetic test delivery for a sink.
      description: >-
        Enqueues a delivery with a synthetic `test_` item event id and kind=test; the delivery
        worker performs the actual HTTP call asynchronously. Returns 202 with the delivery resource.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
        - $ref: '#/components/parameters/SinkId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Test delivery enqueued; Location points at the delivery resource.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              description: Relative URL of the enqueued delivery.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '404':
          description: The collector or sink does not exist (COLLECTOR_NOT_FOUND / SINK_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
  /collectors/{collectorId}/deliveries:
    get:
      operationId: listCollectorDeliveries
      summary: List the deliveries of one collector with their latest attempt summary.
      parameters:
        - $ref: '#/components/parameters/CollectorId'
      responses:
        '200':
          description: Deliveries ordered by creation time.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryPage'
        default:
          $ref: '#/components/responses/PlatformError'
  /deliveries/{deliveryId}:
    get:
      operationId: getDelivery
      summary: Fetch one delivery with its full attempt history.
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
      responses:
        '200':
          description: Delivery resource with all recorded attempts.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDetail'
        '404':
          description: The delivery does not exist (DELIVERY_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
  /deliveries/{deliveryId}/redeliver:
    post:
      operationId: redeliverDelivery
      summary: Reset a delivery to pending for another delivery attempt.
      description: Works from delivered, failed and dead_lettered deliveries; delivering rows must wait for their lease to expire (DELIVERY_IN_FLIGHT).
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The same delivery reset to pending with an incremented redeliveryCount.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '404':
          description: The delivery does not exist (DELIVERY_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        '409':
          description: The delivery is actively being delivered (DELIVERY_IN_FLIGHT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformError'
        default:
          $ref: '#/components/responses/PlatformError'
components:
  headers:
    RequestId:
      description: Correlation identifier for logs, audit evidence and support.
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: extrio_session
  parameters:
    CollectorId:
      name: collectorId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
    AiRunId:
      name: aiRunId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SinkId:
      name: sinkId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable UUID or equivalent token for one logical mutation. Retries reuse the same value.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    PlatformError:
      description: Stable machine-readable API error.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlatformError'
  schemas:
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, username, displayName, role]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [administrator]
    AuthState:
      type: object
      additionalProperties: false
      required: [authEnabled, setupRequired, authenticated, user]
      properties:
        authEnabled:
          type: boolean
        setupRequired:
          type: boolean
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    AuthSetupInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9_.-]{3,64}$'
        password:
          type: string
          minLength: 8
          maxLength: 256
        displayName:
          type: string
          minLength: 1
          maxLength: 64
    AuthLoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    CollectorStatus:
      type: string
      enum: [draft, exploring, ready_review, published]
    RunStatus:
      type: string
      enum: [queued, running, finalizing, succeeded, partially_succeeded, failed, cancelled, timed_out]
    OperationStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, timed_out]
    OperationKind:
      type: string
      enum: [explore, run]
    OperationPhase:
      type: string
      enum: [queued, fetching_list, discovering_details, fetching_details, validating, finalizing, completed]
    CollectionMode:
      type: string
      enum: [single, list_detail]
    FieldReviewDecision:
      type: string
      enum: [approved, risk_accepted, excluded, pending]
    ItemDecision:
      type: string
      enum: [accepted, rejected]
    ArtifactMode:
      type: string
      enum: [metadata_only, sampled, replayable]
    ModelProvider:
      type: string
      enum: [openai, deepseek, qwen, custom]
    ModelProviderConfigurationInput:
      type: object
      additionalProperties: false
      required: [id, name, provider, baseUrl, enabled]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{3,128}$'
        name:
          type: string
          minLength: 1
        provider:
          $ref: '#/components/schemas/ModelProvider'
        baseUrl:
          type: string
          format: uri
          pattern: '^https://'
        apiKey:
          type: string
          minLength: 1
          writeOnly: true
          description: Optional replacement credential. Omit it when editing to preserve the stored credential. It is never returned.
        enabled:
          type: boolean
    ModelProviderConfiguration:
      type: object
      additionalProperties: false
      required: [id, name, provider, baseUrl, enabled, credentialConfigured, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          $ref: '#/components/schemas/ModelProvider'
        baseUrl:
          type: string
        enabled:
          type: boolean
        credentialConfigured:
          type: boolean
        updatedAt:
          type: [string, 'null']
          format: date-time
    ModelConfigurationItemInput:
      type: object
      additionalProperties: false
      required: [id, providerId, modelId, enabled]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{3,128}$'
        providerId:
          type: string
        modelId:
          type: string
          minLength: 1
        enabled:
          type: boolean
    ModelConfigurationItem:
      type: object
      additionalProperties: false
      required: [id, providerId, modelId, enabled, isDefault, updatedAt]
      properties:
        id:
          type: string
        providerId:
          type: string
        modelId:
          type: string
        enabled:
          type: boolean
        isDefault:
          type: boolean
        updatedAt:
          type: [string, 'null']
          format: date-time
    ModelConfigurationInput:
      type: object
      additionalProperties: false
      required: [providers, models, defaultModelId]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ModelProviderConfigurationInput'
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelConfigurationItemInput'
        defaultModelId:
          type: [string, 'null']
    ModelConfiguration:
      type: object
      additionalProperties: false
      required: [providers, models, defaultModelId, updatedAt]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ModelProviderConfiguration'
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelConfigurationItem'
        defaultModelId:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
    ModelSettingInput:
      type: object
      additionalProperties: false
      required: [provider, baseUrl, model, secretRef]
      properties:
        provider:
          $ref: '#/components/schemas/ModelProvider'
        baseUrl:
          type: string
          format: uri
          pattern: '^https://'
        model:
          type: string
          minLength: 1
        secretRef:
          type: string
          pattern: '^env:[A-Z][A-Z0-9_]{2,127}$'
          description: Server-side environment secret reference. Plaintext credentials are never accepted or returned.
    ModelSetting:
      type: object
      additionalProperties: false
      required: [provider, baseUrl, model, secretRef, secretConfigured, updatedAt]
      properties:
        provider:
          $ref: '#/components/schemas/ModelProvider'
        baseUrl:
          type: string
          format: uri
        model:
          type: string
        secretRef:
          type: string
        secretConfigured:
          type: boolean
        updatedAt:
          type: [string, 'null']
          format: date-time
    PageMeta:
      type: object
      additionalProperties: false
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
    PlatformError:
      type: object
      additionalProperties: false
      required: [code, message, requestId, retryable]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        pointer:
          type: [string, 'null']
        details:
          type: object
          additionalProperties: true
    ErrorCode:
      type: string
      description: Stable v1 error taxonomy. New codes may be added without changing existing meanings.
      enum:
        - AUTH_REQUIRED
        - INVALID_CREDENTIALS
        - SETUP_ALREADY_COMPLETED
        - RATE_LIMITED
        - FORBIDDEN
        - VALIDATION_FAILED
        - INVALID_URL
        - HTTPS_REQUIRED
        - DUPLICATE_IN_BATCH
        - SOURCE_ALREADY_EXISTS
        - SOURCE_UNREACHABLE
        - COLLECTION_NOT_FOUND
        - COLLECTOR_NOT_FOUND
        - OPERATION_NOT_FOUND
        - AI_RUN_NOT_FOUND
        - RUN_NOT_FOUND
        - ITEM_NOT_FOUND
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - OPERATION_ALREADY_ACTIVE
        - RUN_ALREADY_ACTIVE
        - RULE_NOT_PUBLISHED
        - CANDIDATE_RULE_NOT_FOUND
        - CANDIDATE_VALIDATION_FAILED
        - RULE_ATTESTATION_INVALID
        - REVIEW_DECISION_INVALID
        - OPERATION_CANCELLED
        - OPERATION_TIMED_OUT
        - INVALID_CURSOR
        - EXPORT_TOO_LARGE
        - SINK_NOT_FOUND
        - DELIVERY_NOT_FOUND
        - DELIVERY_IN_FLIGHT
        - INTERNAL_ERROR
        - UNEXPECTED_RESPONSE
    OperationMetrics:
      type: object
      additionalProperties: false
      required: [listPagesFetched, detailUrlsDiscovered, detailPagesFetched, recordsOutsideWindow, duplicateDetailUrls, newItems, updatedItems, unchangedItems, warningCount]
      properties:
        listPagesFetched:
          type: integer
          minimum: 0
        detailUrlsDiscovered:
          type: integer
          minimum: 0
        detailPagesFetched:
          type: integer
          minimum: 0
        recordsOutsideWindow:
          type: integer
          minimum: 0
        duplicateDetailUrls:
          type: integer
          minimum: 0
        newItems:
          type: integer
          minimum: 0
        updatedItems:
          type: integer
          minimum: 0
        unchangedItems:
          type: integer
          minimum: 0
        warningCount:
          type: integer
          minimum: 0
    Operation:
      type: object
      additionalProperties: false
      required: [id, kind, status, phase, progress, resourceType, resourceId, statusUrl, pollAfterMs, metrics, error]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/OperationKind'
        status:
          $ref: '#/components/schemas/OperationStatus'
        phase:
          $ref: '#/components/schemas/OperationPhase'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        resourceType:
          type: string
          enum: [collector, run]
        resourceId:
          type: string
        statusUrl:
          type: string
        pollAfterMs:
          type: integer
          minimum: 100
          maximum: 10000
        metrics:
          $ref: '#/components/schemas/OperationMetrics'
        error:
          anyOf:
            - $ref: '#/components/schemas/PlatformError'
            - type: 'null'
      allOf:
        - if:
            properties:
              status:
                enum: [queued, running]
          then:
            properties:
              error:
                type: 'null'
        - if:
            properties:
              status:
                enum: [succeeded, failed, cancelled, timed_out]
          then:
            properties:
              phase:
                const: completed
              progress:
                const: 100
        - if:
            properties:
              status:
                const: succeeded
          then:
            properties:
              error:
                type: 'null'
        - if:
            properties:
              status:
                enum: [failed, cancelled, timed_out]
          then:
            properties:
              error:
                $ref: '#/components/schemas/PlatformError'
    AiRunKind:
      type: string
      enum: [rule_generation, rule_repair]
    AiRunTrigger:
      type: string
      enum: [initial_generation, regeneration, repair]
    AiRunResultStatus:
      type: string
