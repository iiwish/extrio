        model:
          type: string
        promptVersion:
          type: string
        status:
          type: string
          enum: [succeeded, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          minimum: 0
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
        estimatedCost:
          type: [number, 'null']
          minimum: 0
        responseDigest:
          type: [string, 'null']
        error:
