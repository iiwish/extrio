        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
        estimatedCost:
          type: [number, 'null']
          minimum: 0
    AiValidationSummary:
      type: object
